[project]
name = "llm-remote-sandbox"
version = "0.1.0"
description = "Remote LLM Sandbox for Red Teaming Multi-Vendor Remote APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi[all]>=0.115.0",
    "google-genai>=1.0.0",
    "gradio>=5.20.0",
    "mistralai>=1.5.0",
    "openai>=1.50.0",
    "openrouter>=1.1.137",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "tomli>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
